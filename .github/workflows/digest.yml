name: Daily digest

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: digest

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Spread capture time over ~25 minutes so snapshots aren't clockwork.
      - name: Random start offset
        if: github.event_name == 'schedule'
        run: sleep $(( RANDOM % 1500 ))

      - uses: actions/checkout@v4

      - name: Build digest
        run: python3 scripts/digest.py

      # Authored as the repo owner (noreply address) so the commit counts on their contribution graph.
      - name: Commit and push
        run: |
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "digest: $(date -u +%F)"
          git push
